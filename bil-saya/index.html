<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7e017">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bil Saya">
<title>Bil &amp; Langganan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, practical money tool for a Bruneian household
   IDEA: a bill envelope pinned to the fridge — one big number, what's due next
   PICTURE: the monthly total large on a flag-yellow field, with a category bar
   COLOUR and TYPE: Brunei yellow, black ink, red accent; Figtree 800 + Figtree
   LAYOUT: yellow hero band, then "coming up" list, then all items, backup last */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#12110c);--ink:light-dark(#141414,#f3f0e2);--mute:light-dark(#5c5a52,#b4b09c);
--hero:light-dark(#f7e017,#1f1c0c);--heroInk:light-dark(#141414,#f7e017);
--line:light-dark(#e6e3d6,#2e2b1f);--card:light-dark(#fbfaf4,#1a1810);--red:light-dark(#c8102e,#ff5a6e);
--btn:light-dark(#141414,#f7e017);--btnInk:light-dark(#f7e017,#141414)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(20px,4vw,48px) max(5vw,16px);max-width:1240px;margin:0 auto}
.hero{background:var(--hero);color:var(--heroInk)}
.hero .band{display:grid;gap:24px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:end}
@media(max-width:760px){.hero .band{grid-template-columns:minmax(0,1fr)}}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;grid-column:1/-1}
h1{font-size:17px;font-weight:800;margin:0}
.lang{display:flex;border:2px solid currentColor;border-radius:99px;overflow:hidden}
.lang button{background:none;border:0;color:inherit;font:600 14px Figtree,sans-serif;padding:8px 14px;min-height:40px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--heroInk);color:var(--hero)}
.big{font-size:clamp(48px,12vw,88px);font-weight:800;line-height:1;letter-spacing:-.02em;white-space:nowrap}
.big small{font-size:.32em;font-weight:600;letter-spacing:0}
.sub{font-size:17px;margin-top:8px}
.note{font-size:13px;opacity:.75;margin-top:4px}
.stackbar{display:flex;height:18px;border-radius:9px;overflow:hidden;background:color-mix(in srgb,currentColor 12%,transparent);margin-bottom:12px}
.stackbar span{height:100%}
.legend{display:grid;gap:6px}
.legend div{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:15px}
.legend i{width:14px;height:14px;border-radius:4px}
.legend b{white-space:nowrap;font-weight:600}
h2{font-size:24px;font-weight:800;margin:0 0 14px;line-height:1.1}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.when{width:64px;text-align:center;border-radius:12px;padding:6px 4px;background:var(--card);border:1px solid var(--line);line-height:1.1}
.when b{display:block;font-size:22px;font-weight:800}
.when span{font-size:13px;color:var(--mute)}
.late .when{border-color:var(--red)}.late .when b,.late .rel{color:var(--red)}
.nm{font-weight:600;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--mute)}
.rel{font-size:13px;font-weight:600}
.amt{font-weight:800;white-space:nowrap;text-align:right}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}
button{font-family:inherit}
.b{background:var(--btn);color:var(--btnInk);border:0;border-radius:12px;font-weight:800;font-size:15px;padding:10px 16px;min-height:44px;cursor:pointer}
.b.ghost{background:none;color:var(--ink);border:2px solid var(--line)}
.b.danger{background:var(--red);color:#fff}
.pay{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pay .b{padding:6px 12px;min-height:40px;font-size:14px}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.chip{border:2px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:6px 14px;min-height:40px;font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input,select{font:16px Figtree,sans-serif;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.search{flex:1 1 180px}
.item{cursor:pointer}.item:hover .nm{text-decoration:underline}
.paused{opacity:.5}
.empty{color:var(--mute);padding:16px 0}
.samp{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px;color:var(--mute);margin:12px 0 0}
.samp button{background:none;border:0;color:var(--red);font-weight:600;font-size:14px;padding:8px 0;cursor:pointer;text-decoration:underline}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet[hidden]{display:none}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px max(4vw,16px) 24px}
@media(min-width:620px){.sheet{align-items:center}.panel{border-radius:20px}}
.f{display:grid;gap:12px}
.f label{display:grid;gap:4px;font-size:14px;font-weight:600}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 10px;font-size:13px;min-height:36px;cursor:pointer}
.chk{display:flex!important;align-items:center;gap:10px}
.chk input{width:22px;min-height:22px;height:22px}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin-top:4px}
.acts div{display:flex;gap:8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;z-index:30;max-width:calc(100% - 32px);font-size:15px}
.toast[hidden]{display:none}
.toast button{background:none;border:0;color:var(--hero);font-weight:800;font-size:15px;min-height:40px;cursor:pointer}
:root[data-theme=dark] .toast button{color:#141414}
details{border-top:1px solid var(--line);padding-top:12px}
summary{font-weight:800;cursor:pointer;min-height:40px;display:flex;align-items:center}
textarea{width:100%;min-height:110px;font:14px ui-monospace,monospace;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:10px}
.warn{color:var(--red);font-size:14px}
.spend{display:grid;gap:20px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
@media(max-width:760px){.spend{grid-template-columns:minmax(0,1fr)}}
.mnav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mnav button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:none;color:var(--ink);font-size:20px;cursor:pointer}
.mnav b{font-size:17px;min-width:110px;text-align:center}
.sbig{font-size:clamp(40px,9vw,60px);font-weight:800;line-height:1;white-space:nowrap}
.x{width:40px;height:40px;border:0;background:none;color:var(--mute);font-size:20px;cursor:pointer;border-radius:10px}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
@media(prefers-reduced-motion:no-preference){.toast{animation:up .25s ease-out}@keyframes up{from{transform:translate(-50%,20px);opacity:0}}}
</style>
</head>
<body>
<header class="hero"><div class="band">
  <div class="top"><h1 data-t="title"></h1>
    <div class="lang" role="group" aria-label="Bahasa / Language"><button id="lms">BM</button><button id="len">EN</button></div></div>
  <div>
    <div class="big" id="total"></div>
    <div class="sub" id="yearly"></div>
    <div class="note" data-t="onceNote"></div>
  </div>
  <div><div class="stackbar" id="bar"></div><div class="legend" id="legend"></div></div>
</div></header>

<main>
<section class="band">
  <h2 data-t="upcoming"></h2>
  <div id="up"></div>
  <p class="warn" id="warn" hidden data-t="storageWarn"></p>
</section>

<section class="band" style="padding-top:0">
  <h2 data-t="spent"></h2>
  <div class="spend">
    <div>
      <div class="mnav"><button id="mPrev" aria-label="&lsaquo;">&lsaquo;</button><b id="mLabel"></b><button id="mNext" aria-label="&rsaquo;">&rsaquo;</button></div>
      <div class="sbig" id="sTotal"></div>
      <div class="sub" id="sYear"></div>
      <div class="note" data-t="spentHelp"></div>
      <div class="legend" id="sLegend" style="margin-top:14px"></div>
    </div>
    <div id="sList"></div>
  </div>
</section>

<section class="band" style="padding-top:0">
  <h2 data-t="allItems"></h2>
  <div class="tools">
    <input class="search" id="q" type="search" autocomplete="off">
    <button class="b" id="addBtn" data-t="add"></button>
  </div>
  <div class="tools" id="filters"></div>
  <div id="list"></div>
  <div class="samp" id="samp" hidden><span data-t="sampleNote"></span><button id="clearSamp" data-t="clearSample"></button></div>
</section>

<section class="band" style="padding-top:0">
  <details><summary data-t="backup"></summary>
    <p class="meta" data-t="backupHelp"></p>
    <button class="b ghost" id="copyBtn" data-t="copy"></button>
    <p><textarea id="imp" aria-label="JSON"></textarea></p>
    <button class="b ghost" id="impBtn" data-t="restore"></button>
  </details>
</section>
</main>

<div class="sheet" id="sheet" hidden><div class="panel" role="dialog" aria-modal="true" aria-labelledby="fTitle">
  <h2 id="fTitle"></h2>
  <form class="f" id="form">
    <div id="presetWrap"><div class="meta" data-t="presets" style="margin-bottom:6px"></div><div class="presets" id="presets"></div></div>
    <label><span data-t="fName"></span><input id="fName" required maxlength="60"></label>
    <div class="two">
      <label><span data-t="fAmt"></span><input id="fAmt" type="number" inputmode="decimal" step="0.01" min="0" required></label>
      <label><span data-t="fCat"></span><select id="fCat"></select></label>
    </div>
    <div class="two">
      <label><span data-t="fCycle"></span><select id="fCycle"></select></label>
      <label><span data-t="fDue"></span><input id="fDue" type="date" required></label>
    </div>
    <label><span data-t="fNote"></span><input id="fNote" maxlength="80"></label>
    <label class="chk"><input id="fActive" type="checkbox" checked><span data-t="fActive"></span></label>
    <div class="acts">
      <button type="button" class="b danger" id="delBtn" data-t="del"></button>
      <div><button type="button" class="b ghost" id="cancelBtn" data-t="cancel"></button><button class="b" data-t="save"></button></div>
    </div>
  </form>
</div></div>

<div class="toast" id="toast" hidden role="status"><span id="tMsg"></span><button id="tUndo"></button></div>

<script>
{
const T={
ms:{title:'Bil & Langganan',perMonth:'sebulan',perYear:'setahun',items:'item',onceNote:'Bayaran sekali tidak dikira dalam jumlah bulanan.',
upcoming:'Akan datang · 30 hari',none:'Tiada bayaran dalam 30 hari akan datang.',allItems:'Semua item',all:'Semua',add:'+ Tambah',search:'Cari…',
paid:'Dah bayar',today:'Hari ini',tomorrow:'Esok',inDays:n=>n+' hari lagi',late:n=>'Lewat '+n+' hari',next:'Seterusnya',
storageWarn:'Data tidak dapat disimpan dalam pelayar ini. Salin sandaran sebelum menutup.',emptyList:'Tiada item. Tekan + Tambah.',
sampleNote:'Ini data contoh. Ubah atau padam ikut keperluan.',clearSample:'Kosongkan contoh',
backup:'Sandaran data',backupHelp:'Salin data untuk disimpan (cth. di WhatsApp atau Notes). Tampal semula untuk pulihkan di telefon lain.',
copy:'Salin data',copied:'Data disalin',restore:'Pulihkan dari teks',importBad:'Data tidak sah',importOk:'Data dipulihkan',
presets:'Pilihan pantas',fName:'Nama',fAmt:'Jumlah (B$)',fCat:'Jenis',fCycle:'Kekerapan',fDue:'Tarikh bayar seterusnya',fNote:'Nota (cth. kad, akaun)',fActive:'Aktif',
save:'Simpan',cancel:'Batal',del:'Padam',delSure:'Tekan lagi untuk padam',newItem:'Item baru',editItem:'Ubah item',
paidToast:d=>'Dah bayar. Seterusnya '+d,doneToast:'Ditanda selesai',delToast:'Item dipadam',savedToast:'Disimpan',undo:'Buat asal',pausedL:'Dihentikan',spent:'Total perbelanjaan',spentHelp:'Dikira daripada setiap kali anda tekan Dah bayar.',thisYear:y=>'Tahun '+y+': ',noSpend:'Belum ada bayaran direkod bulan ini.',
cats:{sub:'Langganan',bill:'Bil',fee:'Yuran',ins:'Insurans / Takaful',loan:'Ansuran',other:'Lain-lain'},
cycles:{weekly:'Mingguan',monthly:'Bulanan',quarterly:'Setiap 3 bulan',yearly:'Tahunan',once:'Sekali'},
mon:['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis']},
en:{title:'Bills & Subscriptions',perMonth:'a month',perYear:'a year',items:'items',onceNote:'One-time payments are left out of the monthly total.',
upcoming:'Coming up · 30 days',none:'Nothing due in the next 30 days.',allItems:'All items',all:'All',add:'+ Add',search:'Search…',
paid:'Paid',today:'Today',tomorrow:'Tomorrow',inDays:n=>'in '+n+' days',late:n=>n+(n==1?' day':' days')+' late',next:'Next',
storageWarn:"Data can't be saved in this browser. Copy a backup before closing.",emptyList:'No items. Tap + Add.',
sampleNote:'This is sample data. Edit or delete as you like.',clearSample:'Clear samples',
backup:'Backup',backupHelp:'Copy your data to keep it somewhere safe (WhatsApp, Notes). Paste it back to restore on another phone.',
copy:'Copy data',copied:'Data copied',restore:'Restore from text',importBad:'That data is not valid',importOk:'Data restored',
presets:'Quick picks',fName:'Name',fAmt:'Amount (B$)',fCat:'Type',fCycle:'How often',fDue:'Next payment date',fNote:'Note (e.g. card, account)',fActive:'Active',
save:'Save',cancel:'Cancel',del:'Delete',delSure:'Tap again to delete',newItem:'New item',editItem:'Edit item',
paidToast:d=>'Paid. Next due '+d,doneToast:'Marked done',delToast:'Item deleted',savedToast:'Saved',undo:'Undo',pausedL:'Paused',spent:'Total spending',spentHelp:'Counted from each time you tap Paid.',thisYear:y=>'Year '+y+': ',noSpend:'No payments recorded this month.',
cats:{sub:'Subscription',bill:'Bill',fee:'Fee',ins:'Insurance / Takaful',loan:'Instalment',other:'Other'},
cycles:{weekly:'Weekly',monthly:'Monthly',quarterly:'Every 3 months',yearly:'Yearly',once:'One-time'},
mon:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']}};
const COL={sub:'#141414',bill:'#c8102e',fee:'#1f6feb',ins:'#00838f',loan:'#b26a00',other:'#8a877c'};
const DARKCOL={sub:'#f7e017'};
const PER={weekly:52/12,monthly:1,quarterly:1/3,yearly:1/12,once:0};
const PRESETS=[['Netflix','sub','monthly'],['Spotify','sub','monthly'],['YouTube Premium','sub','monthly'],['iCloud+','sub','monthly'],['Google One','sub','monthly'],['Disney+','sub','monthly'],['ChatGPT / Claude','sub','monthly'],['Canva Pro','sub','yearly'],['Astro','bill','monthly'],['imagine','bill','monthly'],['DST','bill','monthly'],['Progresif','bill','monthly'],['Bil air','bill','monthly'],['Elektrik (top-up)','bill','monthly'],['Yuran gim','fee','monthly'],['Yuran sekolah','fee','yearly'],['Yuran kelas / tuisyen','fee','monthly'],['Cukai jalan','fee','yearly'],['Takaful kereta','ins','yearly'],['Takaful keluarga','ins','monthly'],['Ansuran kereta','loan','monthly'],['Ansuran telefon','loan','monthly']];
const KEY='bilsub.saya.v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const todayD=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const days=s=>Math.round((parse(s)-todayD())/864e5);
const money=n=>'B$ '+n.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function addMonths(s,n,anchor){const d=parse(s);const r=new Date(d.getFullYear(),d.getMonth()+n,1);const last=new Date(r.getFullYear(),r.getMonth()+1,0).getDate();r.setDate(Math.min(anchor||d.getDate(),last));return iso(r)}
function advance(it){if(it.cycle==='weekly'){const d=parse(it.due);d.setDate(d.getDate()+7);return iso(d)}return addMonths(it.due,{monthly:1,quarterly:3,yearly:12}[it.cycle],it.anchor)}
function sampleItems(){const t=todayD();const off=n=>{const d=new Date(t);d.setDate(d.getDate()+n);return iso(d)};
return[['Netflix','sub',15.9,'monthly',3],['Spotify','sub',5.9,'monthly',11],['iCloud+ 200GB','sub',3.9,'monthly',-1],['imagine Fibre','bill',65,'monthly',6],['Bil air','bill',12,'monthly',18],['Yuran gim','fee',40,'monthly',24],['Cukai jalan','fee',200,'yearly',140],['Takaful kereta','ins',480,'yearly',75]]
.map(([name,cat,amt,cycle,o])=>{const due=off(o);return{id:uid(),name,cat,amt,cycle,due,anchor:parse(due).getDate(),note:'',active:true,sample:true}})}

let items,log=[],lang='ms',filter='all',ok=true,view=new Date();view=new Date(view.getFullYear(),view.getMonth(),1);
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){items=s.items;lang=s.lang||'ms';if(Array.isArray(s.log))log=s.log}}catch(e){ok=false}
if(!Array.isArray(items))items=sampleItems();
function save(){try{localStorage.setItem(KEY,JSON.stringify({items,log,lang}))}catch(e){ok=false}$('warn').hidden=ok}
const t=k=>T[lang][k];
const isDark=()=>{const a=document.documentElement.dataset.theme;return a==='dark'||(a!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches)};
const col=c=>(isDark()&&DARKCOL[c])||COL[c];
const fmtD=s=>{const d=parse(s);return d.getDate()+' '+t('mon')[d.getMonth()]};
const rel=n=>n<0?t('late')(-n):n===0?t('today'):n===1?t('tomorrow'):t('inDays')(n);
const monthly=it=>it.active?it.amt*PER[it.cycle]:0;

function hero(){
 const act=items.filter(i=>i.active),tot=act.reduce((a,i)=>a+monthly(i),0);
 $('total').innerHTML=esc(money(tot))+' <small>'+t('perMonth')+'</small>';
 $('yearly').textContent=money(tot*12)+' '+t('perYear')+' · '+act.length+' '+t('items');
 const by={};act.forEach(i=>by[i.cat]=(by[i.cat]||0)+monthly(i));
 const rows=Object.entries(by).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);
 $('bar').innerHTML=rows.map(([c,v])=>`<span style="width:${v/tot*100}%;background:${col(c)}" title="${esc(t('cats')[c])}"></span>`).join('');
 $('legend').innerHTML=rows.map(([c,v])=>`<div><i style="background:${col(c)}"></i><span>${esc(t('cats')[c])}</span><b>${money(v)}</b></div>`).join('');
}
function upcoming(){
 const list=items.filter(i=>i.active&&days(i.due)<=30).sort((a,b)=>a.due<b.due?-1:1);
 $('up').innerHTML=list.length?list.map(i=>{const n=days(i.due),d=parse(i.due);
  return `<div class="row ${n<0?'late':''}"><div class="when"><b>${d.getDate()}</b><span>${t('mon')[d.getMonth()]}</span></div>
  <div><div class="nm"><span class="dot" style="background:${col(i.cat)}"></span>${esc(i.name)}</div><div class="rel">${rel(n)}</div></div>
  <div class="pay"><div class="amt">${money(i.amt)}</div><button class="b" data-pay="${i.id}">${t('paid')}</button></div></div>`}).join('')
 :`<p class="empty">${t('none')}</p>`;
}
function list(){
 const q=$('q').value.trim().toLowerCase();
 const cats=[...new Set(items.map(i=>i.cat))];
 if(filter!=='all'&&!cats.includes(filter))filter='all';
 $('filters').innerHTML=['all',...Object.keys(COL).filter(c=>cats.includes(c))].map(c=>`<button class="chip" data-f="${c}" aria-pressed="${filter===c}">${esc(c==='all'?t('all'):t('cats')[c])}</button>`).join('');
 const l=items.filter(i=>(filter==='all'||i.cat===filter)&&(!q||(i.name+' '+i.note).toLowerCase().includes(q))).sort((a,b)=>(b.active-a.active)||(a.due<b.due?-1:1));
 $('list').innerHTML=l.length?l.map(i=>`<div class="row item ${i.active?'':'paused'}" data-edit="${i.id}" tabindex="0" role="button">
  <span class="dot" style="background:${col(i.cat)};width:12px;height:12px"></span>
  <div><div class="nm">${esc(i.name)}</div><div class="meta">${esc(t('cycles')[i.cycle])} · ${i.active?t('next')+' '+fmtD(i.due):t('pausedL')}${i.note?' · '+esc(i.note):''}</div></div>
  <div class="amt">${money(i.amt)}</div></div>`).join(''):`<p class="empty">${t('emptyList')}</p>`;
 $('samp').hidden=!items.some(i=>i.sample);
}
function texts(){
 document.documentElement.lang=lang;document.title=t('title');
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
 $('q').placeholder=t('search');
 $('lms').setAttribute('aria-pressed',lang==='ms');$('len').setAttribute('aria-pressed',lang==='en');
 $('fCat').innerHTML=Object.keys(COL).map(c=>`<option value="${c}">${esc(t('cats')[c])}</option>`).join('');
 $('fCycle').innerHTML=Object.keys(PER).map(c=>`<option value="${c}">${esc(t('cycles')[c])}</option>`).join('');
 $('presets').innerHTML=PRESETS.map((p,k)=>`<button type="button" data-p="${k}">${esc(p[0])}</button>`).join('');
}
function spend(){
 const y=view.getFullYear(),m=view.getMonth(),key=y+'-'+pad(m+1);
 const inM=log.filter(e=>e.date.slice(0,7)===key).sort((a,b)=>a.date<b.date?1:-1);
 const tot=inM.reduce((a,e)=>a+e.amt,0),yt=log.filter(e=>e.date.slice(0,4)==String(y)).reduce((a,e)=>a+e.amt,0);
 $('mLabel').textContent=t('mon')[m]+' '+y;
 $('sTotal').textContent=money(tot);
 $('sYear').textContent=t('thisYear')(y)+money(yt);
 const by={};inM.forEach(e=>by[e.cat]=(by[e.cat]||0)+e.amt);
 $('sLegend').innerHTML=Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div><i style="background:${col(c)}"></i><span>${esc(t('cats')[c]||c)}</span><b>${money(v)}</b></div>`).join('');
 $('sList').innerHTML=inM.length?inM.map(e=>`<div class="lrow"><span class="meta" style="width:48px">${fmtD(e.date)}</span><span class="nm"><span class="dot" style="background:${col(e.cat)}"></span>${esc(e.name)}</span><span class="amt">${money(e.amt)}</span><button class="x" data-rm="${e.id}" aria-label="${esc(t('del'))}">&times;</button></div>`).join(''):`<p class="empty">${t('noSpend')}</p>`;
}
function render(){hero();upcoming();spend();list();save()}

let tm,undoFn;
function toast(msg,undo){$('tMsg').textContent=msg;undoFn=undo;$('tUndo').textContent=t('undo');$('tUndo').hidden=!undo;$('toast').hidden=false;clearTimeout(tm);tm=setTimeout(()=>$('toast').hidden=true,5000)}
$('tUndo').onclick=()=>{if(undoFn){undoFn();undoFn=null;render()}$('toast').hidden=true};
const snap=()=>JSON.parse(JSON.stringify({items,log}));
const restore=p=>{items=p.items;log=p.log};

let editing=null,delArmed=false;
function openForm(it){
 editing=it?it.id:null;delArmed=false;
 const ci=$('fCat').value,cy=$('fCycle').value;
 $('fTitle').textContent=t(it?'editItem':'newItem');
 $('presetWrap').hidden=!!it;$('delBtn').hidden=!it;$('delBtn').textContent=t('del');
 $('fName').value=it?it.name:'';$('fAmt').value=it?it.amt:'';
 $('fCat').value=it?it.cat:'sub';$('fCycle').value=it?it.cycle:'monthly';
 $('fDue').value=it?it.due:iso(todayD());$('fNote').value=it?it.note:'';$('fActive').checked=it?it.active:true;
 $('sheet').hidden=false;setTimeout(()=>$('fName').focus(),50);
}
const closeForm=()=>{$('sheet').hidden=true};
$('addBtn').onclick=()=>openForm(null);
$('cancelBtn').onclick=closeForm;
$('sheet').onclick=e=>{if(e.target===$('sheet'))closeForm()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('sheet').hidden)closeForm()});
$('presets').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;const p=PRESETS[b.dataset.p];$('fName').value=p[0];$('fCat').value=p[1];$('fCycle').value=p[2];$('fAmt').focus()};
$('form').onsubmit=e=>{e.preventDefault();
 const amt=Math.round(parseFloat($('fAmt').value)*100)/100,due=$('fDue').value;
 if(!(amt>=0)||!due)return;
 const prev=snap();
 const data={name:$('fName').value.trim(),amt,cat:$('fCat').value,cycle:$('fCycle').value,due,anchor:parse(due).getDate(),note:$('fNote').value.trim(),active:$('fActive').checked,sample:false};
 if(editing){const i=items.find(x=>x.id===editing);Object.assign(i,data)}else items.push({id:uid(),...data});
 closeForm();render();toast(t('savedToast'),()=>restore(prev));
};
$('delBtn').onclick=()=>{
 if(!delArmed){delArmed=true;$('delBtn').textContent=t('delSure');return}
 const prev=snap();items=items.filter(x=>x.id!==editing);closeForm();render();toast(t('delToast'),()=>restore(prev));
};
$('up').onclick=e=>{const b=e.target.closest('[data-pay]');if(!b)return;
 const prev=snap(),it=items.find(x=>x.id===b.dataset.pay);
 log.push({id:uid(),item:it.id,name:it.name,cat:it.cat,amt:it.amt,date:iso(todayD())});
 if(it.cycle==='once'){it.active=false;render();toast(t('doneToast'),()=>restore(prev))}
 else{it.due=advance(it);while(days(it.due)<0)it.due=advance(it);render();toast(t('paidToast')(fmtD(it.due)),()=>restore(prev))}
};
$('list').onclick=e=>{const r=e.target.closest('[data-edit]');if(r)openForm(items.find(x=>x.id===r.dataset.edit))};
$('list').onkeydown=e=>{if(e.key==='Enter'){const r=e.target.closest('[data-edit]');if(r)openForm(items.find(x=>x.id===r.dataset.edit))}};
$('filters').onclick=e=>{const b=e.target.closest('[data-f]');if(b){filter=b.dataset.f;list()}};
$('q').oninput=list;
$('mPrev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);spend()};
$('mNext').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);spend()};
$('sList').onclick=e=>{const b=e.target.closest('[data-rm]');if(!b)return;const prev=snap();log=log.filter(x=>x.id!==b.dataset.rm);render();toast(t('delToast'),()=>restore(prev))};
$('clearSamp').onclick=()=>{const prev=snap();items=items.filter(i=>!i.sample);render();toast(t('delToast'),()=>restore(prev))};
const setLang=l=>{lang=l;texts();render()};
$('lms').onclick=()=>setLang('ms');$('len').onclick=()=>setLang('en');
$('copyBtn').onclick=async()=>{const s=JSON.stringify({items,log});$('imp').value=s;try{await navigator.clipboard.writeText(s);toast(t('copied'))}catch(e){$('imp').select()}};
$('impBtn').onclick=()=>{try{const d=JSON.parse($('imp').value);const a=Array.isArray(d)?d:d.items;
 if(!Array.isArray(a)||!a.every(i=>i&&typeof i.name==='string'&&typeof i.amt==='number'&&PER[i.cycle]!==undefined&&COL[i.cat]&&/^\d{4}-\d\d-\d\d$/.test(i.due)))throw 0;
 const prev=snap();items=a.map(i=>({id:i.id||uid(),name:i.name,amt:i.amt,cat:i.cat,cycle:i.cycle,due:i.due,anchor:i.anchor||parse(i.due).getDate(),note:i.note||'',active:i.active!==false,sample:!!i.sample}));
 log=Array.isArray(d.log)?d.log.filter(e=>e&&typeof e.amt==='number'&&/^\d{4}-\d\d-\d\d$/.test(e.date)&&typeof e.name==='string').map(e=>({id:e.id||uid(),item:e.item||'',name:e.name,cat:COL[e.cat]?e.cat:'other',amt:e.amt,date:e.date})):[];
 render();toast(t('importOk'),()=>restore(prev))}catch(e){toast(t('importBad'))}};
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
texts();render();
}
</script>
</body>
</html>
