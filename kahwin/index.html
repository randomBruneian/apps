<!DOCTYPE html>
<html lang="ms">

<meta name="theme-color" content="#4A1838">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Raja Sehari Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mulish:wght@400;600;700&display=swap">
<style>
/* VOICE: warm, ceremonial, practical — a Brunei family planning a majlis
   IDEA: a berian tray card edged with a songket band
   PICTURE: the countdown to the akad nikah on deep plum, gold songket band below
   COLOUR and TYPE: plum, gold, leaf green; Marcellus + Mulish
   LAYOUT: hero, sticky tabs, one calm column of panels */
:root{
  --bg:#FAF5F7; --surface:#FFFFFF; --ink:#33142B; --muted:#7D6474; --line:#EADCE3;
  --plum:#4A1838; --gold:#B8892B; --goldsoft:#F3E6C8; --leaf:#3D6B4E; --leafsoft:#DDEBE1; --warn:#A8452F;
  --onplum:#FBEFD8;
  --display:"Marcellus","Palatino Linotype",Georgia,serif;
  --body:"Mulish",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#170D14; --surface:#22141E; --ink:#F4E8EE; --muted:#B79FAE; --line:#3A2433;
  --plum:#3A1230; --gold:#D9B25A; --goldsoft:#3B2F18; --leaf:#7DB592; --leafsoft:#1E3127; --warn:#E08A72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#170D14; --surface:#22141E; --ink:#F4E8EE; --muted:#B79FAE; --line:#3A2433;
  --plum:#3A1230; --gold:#D9B25A; --goldsoft:#3B2F18; --leaf:#7DB592; --leafsoft:#1E3127; --warn:#E08A72; color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--plum)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.hero{background:var(--plum);color:var(--onplum);padding-top:env(safe-area-inset-top,0px)}
header .wrap{padding-block:20px 18px;display:grid;gap:4px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:8px}
.eyebrow{font-size:13px;opacity:.8}
.lang{display:flex;border:1px solid color-mix(in srgb,var(--onplum) 35%,transparent);border-radius:99px;overflow:hidden}
.lang button{background:none;border:0;color:var(--onplum);font:600 13px var(--body);padding:8px 13px;min-height:36px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--gold);color:#2A0E20}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,8vw,40px);line-height:1.1;margin:6px 0 0;text-wrap:balance}
h1 .amp{color:var(--gold)}
.when{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
.days{font-family:var(--display);font-size:48px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.when small{opacity:.85;font-size:14px}
.band{height:12px;background:
 linear-gradient(135deg,var(--plum) 50%,transparent 50%) 0 0/14px 12px,
 linear-gradient(225deg,var(--plum) 50%,transparent 50%) 0 0/14px 12px,var(--gold)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:8px}
nav.tabs button{flex:none;background:none;border:0;border-radius:99px;padding:8px 14px;min-height:40px;font:600 14px var(--body);color:var(--muted);cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--plum);color:var(--onplum)}
:root[data-theme="dark"] nav.tabs button[aria-selected="true"]{background:var(--gold);color:#2A0E20}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.tabs button[aria-selected="true"]{background:var(--gold);color:#2A0E20}}
main .wrap{padding-block:18px 48px;display:grid;gap:18px}
.note{background:var(--goldsoft);border-radius:10px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
h3{font-size:14px;color:var(--muted);margin:0 0 6px;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:9px}
.bar i.over{background:var(--warn)}
.list{display:grid}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;overflow-wrap:anywhere}
.row.done .grow{color:var(--muted);text-decoration:line-through}
.chk{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid var(--gold);background:none;cursor:pointer;display:grid;place-items:center;color:transparent;font-size:14px}
.chk[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:#fff}
.pill{flex:none;font-size:12px;font-weight:700;border-radius:99px;padding:6px 10px;min-height:32px;border:0;cursor:pointer;font-family:var(--body)}
.p0{background:var(--line);color:var(--muted)} .p1{background:var(--goldsoft);color:var(--ink)} .p2{background:var(--leafsoft);color:var(--leaf)} .p3{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.side{flex:none;font-size:12px;font-weight:700;color:var(--muted);width:20px;text-align:center}
.x{flex:none;background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;min-width:32px;min-height:32px;line-height:1}
.x:hover{color:var(--warn)}
input,select{font:16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{width:96px;text-align:right;font-variant-numeric:tabular-nums}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.add input[type=text]{flex:1 1 160px}
.btn{font:700 14px var(--body);border-radius:8px;padding:10px 14px;min-height:44px;border:0;background:var(--plum);color:var(--onplum);cursor:pointer;display:inline-flex;align-items:center}
:root[data-theme="dark"] .btn{background:var(--gold);color:#2A0E20}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{background:var(--gold);color:#2A0E20}}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.phase{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px;gap:8px}
.phase small{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.fields label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.fields .full{grid-column:1/-1}
.tot{display:flex;justify-content:space-between;gap:8px;font-weight:700;padding-top:10px;border-top:2px solid var(--ink);margin-top:4px;font-variant-numeric:tabular-nums}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted);font-size:14px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:420px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.num{width:80px}.fields{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
.dashbtn{width:100%;justify-content:center;font-size:16px;min-height:52px;border-radius:12px}
.overlay{position:fixed;inset:0;z-index:50;background:#fff;overflow:auto;color-scheme:light}
.overlay[hidden]{display:none}
.otools{position:sticky;top:0;z-index:2;background:#4A1838;display:flex;gap:8px;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.otools .btn{background:#B8892B!important;color:#2A0E20!important}
.otools .btn.ghost{background:none!important;color:#FBEFD8!important;border-color:rgba(251,239,216,.4)}
.dash{--ink:#33142B;--mute:#6E5664;--line:#EADCE3;--plum:#4A1838;--gold:#B8892B;--green:#2E7D4F;--red:#A8452F;--grey:#D9CED4;background:#fff;color:var(--ink);font:15px/1.5 Mulish,system-ui,sans-serif;max-width:980px;margin:0 auto;padding:20px max(16px,4vw) 40px}
.dash *{box-sizing:border-box;min-width:0}
.dash .dh{border-bottom:3px solid var(--gold);padding-bottom:14px;margin-bottom:16px}
.dash .dk{font-size:13px;color:var(--mute)}
.dash h1{font:400 clamp(28px,6vw,40px)/1.1 Marcellus,Georgia,serif;margin:4px 0 6px;color:var(--plum)}
.dash h1 span{color:var(--gold)}
.dash .meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--mute)}
.dash .meta b{color:var(--ink)}
.dash .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.dash .kpi{border:1px solid var(--line);border-radius:12px;padding:12px}
.dash .kpi b{display:block;font:400 30px/1.1 Marcellus,Georgia,serif;font-variant-numeric:tabular-nums}
.dash .kpi span{font-size:13px;color:var(--mute)}
.dash .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.dash section{border:1px solid var(--line);border-radius:14px;padding:14px}
.dash section.wide{grid-column:1/-1}
.dash h2{font:400 20px/1.2 Marcellus,Georgia,serif;margin:0 0 4px}
.dash .sub{font-size:13px;color:var(--mute);margin:0 0 10px}
.dash .br{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.dash .br>span:first-child{overflow-wrap:anywhere;line-height:1.25}
.dash .tr{height:14px;background:transparent;border:1.5px solid var(--grey);border-radius:4px;position:relative;overflow:hidden}
.dash .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:0 4px 4px 0}
.dash .tr i.over{background:var(--red)}
.dash .pl{height:12px;border-radius:4px;background:var(--grey);overflow:hidden}
.dash .pl i{display:block;height:100%;background:var(--green);border-radius:0 4px 4px 0}
.dash .stk{display:flex;gap:2px;height:16px}
.dash .stk i{display:block;height:100%}
.dash .stk i:first-child{border-radius:4px 0 0 4px}.dash .stk i:last-child{border-radius:0 4px 4px 0}.dash .stk i:only-child{border-radius:4px}
.dash .v{font-size:13px;color:var(--mute);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.dash .lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mute);margin-bottom:8px}
.dash .lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dash ol{margin:0;padding-left:20px}.dash li{padding:3px 0}
.dash .ft{font-size:12px;color:var(--mute);margin-top:18px;text-align:center}
@media(max-width:700px){.dash .grid{grid-template-columns:minmax(0,1fr)}.dash .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.dash .br{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:7px 0}.dash .br>span:first-child{grid-column:1;grid-row:1}.dash .br>.v{grid-column:2;grid-row:1}.dash .br>div{grid-column:1/-1;grid-row:2}}
@media print{.otools{display:none}.dash section{break-inside:avoid}}
</style>
</head>

 if(b.dataset.tab){tab=+b.dataset.tab;confirming=false;msg="";render();window.scrollTo({top:0});return}
 const a=b.dataset.act,id=b.dataset.id;if(!a)return;
 const val=s=>{const el=$(s);const v=el.value.trim();el.value="";return v};
 switch(a){
  case"ask":confirming=true;break; case"cancel":confirming=false;break;
  case"dl":download();return;
  case"dash":openDash();return;
  case"closedash":$("#overlay").hidden=true;return;
  case"dldash":dlDash();return;
  case"copytel":{const n=S.kadiTel||"";try{navigator.clipboard.writeText(n).then(()=>{msg=L().copied;render()},()=>{})}catch(e){}return}
  case"wipe":S={lang:S.lang,sample:false,bride:"",groom:"",date:"",venue:"",kadi:"",kadiTel:"",tasks:taskTemplate().map(x=>({...x,done:false})),total:0,
    budget:budgetTemplate().map(x=>({...x,plan:0,actual:0})),hantaran:[],guests:[]};confirming=false;break;
  case"tog":{const x=find(S.tasks,id);x.done=!x.done;break}
  case"deltask":S.tasks=S.tasks.filter(x=>x.id!==id);break;
  case"addtask":{const v=val("#new-task");if(v)S.tasks.push({id:uid(),bm:v,custom:true,ph:$("#new-phase").value,done:false});break}
  case"delb":S.budget=S.budget.filter(x=>x.id!==id);break;
  case"addb":{const v=val("#new-b");if(v)S.budget.push({id:uid(),bm:v,custom:true,plan:0,actual:0});break}
  case"st":{const h=find(S.hantaran,id);h.st=(h.st+1)%3;break}
  case"delh":S.hantaran=S.hantaran.filter(x=>x.id!==id);break;
  case"addh":{const v=val("#new-h-"+b.dataset.s);if(v)S.hantaran.push({id:uid(),bm:v,custom:true,s:b.dataset.s,st:0,cost:0});break}
  case"rsvp":{const g=find(S.guests,id);g.r=(g.r+1)%3;break}
  case"delg":S.guests=S.guests.filter(x=>x.id!==id);break;
  case"addg":{const v=val("#new-g");if(v)S.guests.push({id:uid(),name:v,pax:+$("#new-gp").value||1,s:$("#new-gs").value,r:0});break}
 }
 save();render();
});
document.addEventListener("change",e=>{
 const el=e.target,d=el.dataset;
 if(el.id==="file-in"){const f=el.files[0];if(f)f.text().then(restore,()=>{msg=L().importBad;render()});return}
 if(d.f){S[d.f]=d.f==="total"?(+el.value||0):el.value}
 else if(d.b){find(S.budget,d.b)[d.k]=+el.value||0}
 else if(d.h){find(S.hantaran,d.h).cost=+el.value||0}
 else if(d.g){find(S.guests,d.g).pax=+el.value||0}
 else return;
 save();render();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#overlay").hidden){$("#overlay").hidden=true;return}if(e.key!=="Enter"||e.target.tagName!=="INPUT"||e.target.type!=="text"||e.target.dataset.f)return;
 const btn=e.target.parentElement.querySelector("[data-act^=add]");if(btn)btn.click();});
render();
}
</script>
</body>
</html>
